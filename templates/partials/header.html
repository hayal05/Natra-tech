{% set nav = [("About", "/about"), ("Services", "/services"), ("Projects", "/projects"), ("Careers", "/careers")] %}
<header class="site-header">
  <div class="container nav">
    <a class="logo" href="/" aria-label="{{ company.name }} home"><img class="brand-logo" src="{{ url_for('static', filename='images/natra-logo.jpg', v='20261022') }}" width="38" height="38" alt=""><span class="brand-wordmark"><span class="brand-natra">NATRA</span><span class="brand-technology">Technology</span></span></a>
    <button class="nav-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="nav-links">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav-links" id="nav-links" aria-label="Main navigation">
      <div class="nav-primary">
        {% for label, path in nav %}
        <a class="nav-link{{ ' is-active' if request.path.startswith(path) }}" href="{{ path }}"{% if request.path.startswith(path) %} aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
      </div>
      <div class="nav-actions">
        <a class="nav-link nav-admin-link" href="/admin">Admin Login</a>
        <a class="btn btn-sm sms-portal-btn" href="https://ethiosms.onrender.com" target="_blank" rel="noopener noreferrer" aria-label="Open SMS Gateway Console in a new tab"><svg class="sms-portal-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg><span>SMS Gateway</span><svg class="sms-portal-external" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 3h7v7m0-7-9 9"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></a>
        <a class="btn btn-sm nav-contact-btn{{ ' is-active' if request.path.startswith('/contact') }}" href="/contact"{% if request.path.startswith('/contact') %} aria-current="page"{% endif %}>Let's talk <span aria-hidden="true">↗</span></a>
      </div>
    </nav>
  </div>
</header>
