{% for service in services %}
<article class="service reveal">
  <span class="service-num">{{ "%02d"|format(loop.index) }}</span>
  <div>
    <h3>{{ service.title }}</h3>
    <p class="service-tag">{{ service.tagline }}</p>
    {% if full %}<p class="service-detail muted">{{ service.detail }}</p>{% endif %}
    <span class="gold-line"></span>
  </div>
</article>
{% endfor %}
