{% for num, title, tagline, detail in services %}
<article class="service reveal">
  <span class="service-num">{{ num }}</span>
  <div>
    <h3>{{ title }}</h3>
    <p class="service-tag">{{ tagline }}</p>
    {% if full %}<p class="service-detail muted">{{ detail }}</p>{% endif %}
    <span class="gold-line"></span>
  </div>
</article>
{% endfor %}
