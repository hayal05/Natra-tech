{% for p in projects %}
<a class="project reveal" href="{{ 'https://www.youtube.com/watch?v=' ~ p.video_id if p.video_id else '/contact' }}" {% if p.video_id %}target="_blank" rel="noopener"{% endif %}>
  <div class="project-img variant-{{ p.variant }}" role="img" aria-label="{{ p.name }} preview">{% if p.image_url %}<img src="{{ p.image_url }}" alt="{{ p.name }} project image" loading="lazy" style="width:100%;height:100%;object-fit:cover">{% endif %}</div>
  <div class="project-meta">
    <div><h3>{{ p.name }}</h3><p class="muted">{{ p.tags }} · {{ p.year }}</p></div>
    {% if p.video_id %}<span class="muted" aria-label="Video available">Video available on YouTube · </span>{% endif %}
    <span class="project-num">{{ "%02d"|format(loop.index) }} <span class="arrow">→</span></span>
  </div>
</a>
{% endfor %}
