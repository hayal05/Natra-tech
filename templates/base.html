<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ company.name }} — We build what's next{% endblock %}</title>
  <meta name="description" content="{% block description %}Digital products, software and intelligent systems for modern businesses.{% endblock %}">
  {% block robots %}{% endblock %}
  <link rel="canonical" href="{{ site_url() }}{{ request.path }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050505'/%3E%3Cpath d='M16 4l12 12-12 12L4 16z' fill='%23d4af37'/%3E%3C/svg%3E">
  <meta property="og:site_name" content="{{ company.name }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:url" content="{{ site_url() }}{{ request.path }}">
  <meta property="og:image" content="{{ site_url() }}{{ url_for('static', filename='images/og.png') }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#050505">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% block header %}{% include "partials/header.html" %}{% endblock %}
  <main id="main">{% block content %}{% endblock %}</main>
  {% block footer %}{% include "partials/footer.html" %}{% endblock %}
  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
