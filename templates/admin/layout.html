{% extends "base.html" %}
{% block robots %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block header %}
<header class="admin-bar">
  <div class="container admin-bar-inner">
    <a class="logo" href="/admin/dashboard"><span>◆</span>{{ company.name }} <small class="muted">Admin</small></a>
    <nav class="admin-nav" aria-label="Admin">
      <a href="/admin/dashboard" class="nav-link{{ ' is-active' if request.path == '/admin/dashboard' }}">Dashboard</a>
      <a href="/admin/applications" class="nav-link{{ ' is-active' if request.path.startswith('/admin/applications') }}">Applications</a>
      <a href="/admin/jobs" class="nav-link{{ ' is-active' if request.path.startswith('/admin/jobs') }}">Jobs</a>
      <a href="/admin/videos" class="nav-link{{ ' is-active' if request.path.startswith('/admin/videos') }}">Videos</a>
      <form method="post" action="/admin/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="btn btn-sm" type="submit">Log out</button>
      </form>
    </nav>
  </div>
</header>
{% for message in get_flashed_messages() %}<div class="container flash" role="status">{{ message }}</div>{% endfor %}
{% endblock %}
{% block footer %}{% endblock %}
