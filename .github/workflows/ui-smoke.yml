name: UI smoke checks
on:
  pull_request:
    paths:
      - 'templates/**'
      - 'static/**'
      - 'scripts/ui_smoke_check.py'
      - '.github/workflows/ui-smoke.yml'
  push:
    branches:
      - feature/ui-redesign-foundation
    paths:
      - 'templates/**'
      - 'static/**'
      - 'scripts/ui_smoke_check.py'
      - '.github/workflows/ui-smoke.yml'
permissions:
  contents: read
jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Jinja2
        run: python -m pip install 'jinja2>=3.1,<4'
      - name: Compile Python modules
        run: python -m compileall -q app scripts
      - name: Validate UI templates and assets
        run: python scripts/ui_smoke_check.py
